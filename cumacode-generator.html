<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CumaCode Post Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0d0d0d;
    --yellow: #F5F500;
    --white: #F8F8F2;
    --gray: #888;
    --border: 3px solid #0d0d0d;
    --shadow: 5px 5px 0 #0d0d0d;
  }

  body {
    background: var(--white);
    font-family: 'DM Sans', sans-serif;
    color: var(--black);
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--black);
    color: var(--yellow);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: var(--border);
  }
  .topbar-logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .topbar-tag { opacity: 0.6; font-size: 11px; }

  /* ── LAYOUT ── */
  .app { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 44px); }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: var(--border);
    padding: 0;
    overflow-y: auto;
    background: var(--white);
  }

  .sidebar-section {
    border-bottom: var(--border);
    padding: 20px;
  }
  .sidebar-section:last-child { border-bottom: none; }

  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #ddd;
  }

  /* Toggle buttons */
  .toggle-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .toggle-btn {
    background: var(--white);
    border: none;
    padding: 10px 6px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.1s;
    border-right: 2px solid var(--black);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .toggle-btn:last-child { border-right: none; }
  .toggle-btn.active { background: var(--yellow); }
  .toggle-btn:hover:not(.active) { background: #f0f0e8; }

  .toggle-group-3 { grid-template-columns: 1fr 1fr 1fr; }

  /* Inputs */
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    color: var(--black);
  }
  .field input[type="text"],
  .field textarea,
  .field select {
    width: 100%;
    border: var(--border);
    padding: 9px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--white);
    color: var(--black);
    outline: none;
    resize: vertical;
    box-shadow: 3px 3px 0 var(--black);
    transition: box-shadow 0.1s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    box-shadow: 5px 5px 0 var(--black);
  }
  .field textarea { min-height: 70px; }

  /* Color pickers */
  .color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .color-opt {
    width: 34px; height: 34px;
    border: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
  }
  .color-opt:hover { transform: scale(1.1); }
  .color-opt.selected { border-color: var(--black); box-shadow: 3px 3px 0 var(--black); }
  .color-opt-custom {
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; background: #f0f0e8;
    border: 3px solid #ccc; cursor: pointer;
  }

  /* Upload area */
  .upload-area {
    border: 3px dashed var(--black);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    background: #fafaf4;
    transition: background 0.15s;
    position: relative;
    margin-bottom: 10px;
  }
  .upload-area:hover { background: #f5f5e0; }
  .upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 28px; margin-bottom: 8px; }
  .upload-text { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .upload-sub { font-size: 11px; color: var(--gray); margin-top: 4px; }

  /* CTA buttons */
  .btn-primary {
    width: 100%;
    background: var(--yellow);
    border: var(--border);
    padding: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
    margin-bottom: 10px;
  }
  .btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--black); }
  .btn-primary:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--black); }
  .btn-secondary {
    width: 100%;
    background: var(--black);
    border: var(--border);
    padding: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--white);
    box-shadow: 5px 5px 0 #555;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-secondary:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #555; }

  /* ── CANVAS AREA ── */
  .canvas-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 24px;
    background: repeating-linear-gradient(
      45deg, #f0f0e8, #f0f0e8 4px, var(--white) 4px, var(--white) 20px
    );
    overflow-y: auto;
  }

  .canvas-wrap {
    position: relative;
    display: inline-block;
    box-shadow: 10px 10px 0 var(--black);
    border: var(--border);
  }

  #mainCanvas {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .canvas-info {
    margin-top: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--gray);
    text-align: center;
    letter-spacing: 0.06em;
  }

  .download-row {
    display: flex; gap: 10px; margin-top: 20px;
  }
  .dl-btn {
    flex: 1;
    background: var(--black);
    color: var(--yellow);
    border: var(--border);
    padding: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 5px 5px 0 #444;
    transition: transform 0.1s, box-shadow 0.1s;
    text-align: center;
  }
  .dl-btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #444; }

  /* Range */
  .field input[type="range"] {
    width: 100%; height: 6px;
    border: 2px solid var(--black);
    box-shadow: none;
    padding: 0;
    cursor: pointer;
    accent-color: var(--black);
  }
  .range-val {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-align: right;
    color: var(--gray);
    margin-top: 4px;
  }

  /* Scrollbar */
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: var(--white); }
  .sidebar::-webkit-scrollbar-thumb { background: var(--black); }

  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: var(--border); }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">CUMACODE</span>
  <span>POST GENERATOR</span>
  <span class="topbar-tag">#BayarCumaCuma</span>
</div>

<div class="app">
  <!-- ── SIDEBAR ── -->
  <div class="sidebar">

    <!-- Template Type -->
    <div class="sidebar-section">
      <div class="section-label">Template</div>
      <div class="toggle-group">
        <button class="toggle-btn active" onclick="setTemplate('project')" id="btn-project">PROJECT</button>
        <button class="toggle-btn" onclick="setTemplate('news')" id="btn-news">NEWS</button>
      </div>
    </div>

    <!-- Aspect Ratio -->
    <div class="sidebar-section">
      <div class="section-label">Rasio</div>
      <div class="toggle-group">
        <button class="toggle-btn active" onclick="setRatio('square')" id="btn-sq">1:1</button>
        <button class="toggle-btn" onclick="setRatio('portrait')" id="btn-pt">4:5</button>
      </div>
    </div>

    <!-- Background -->
    <div class="sidebar-section">
      <div class="section-label">Background</div>
      <div class="toggle-group">
        <button class="toggle-btn active" onclick="setBgMode('solid')" id="btn-solid">SOLID</button>
        <button class="toggle-btn" onclick="setBgMode('photo')" id="btn-photo">FOTO</button>
      </div>

      <!-- Solid colors -->
      <div id="solid-opts">
        <div class="color-row">
          <div class="color-opt selected" style="background:#F5F500" onclick="setBgColor('#F5F500')" title="Kuning"></div>
          <div class="color-opt" style="background:#0d0d0d" onclick="setBgColor('#0d0d0d')" title="Hitam"></div>
          <div class="color-opt" style="background:#F8F8F2" onclick="setBgColor('#F8F8F2')" title="Putih"></div>
          <div class="color-opt" style="background:#E63946" onclick="setBgColor('#E63946')" title="Merah"></div>
          <div class="color-opt" style="background:#2196F3" onclick="setBgColor('#2196F3')" title="Biru"></div>
          <div class="color-opt" style="background:#4CAF50" onclick="setBgColor('#4CAF50')" title="Hijau"></div>
          <div class="color-opt color-opt-custom" title="Warna custom">
            <input type="color" id="customBgColor" value="#F5F500" style="opacity:0;position:absolute;width:34px;height:34px;cursor:pointer" onchange="setBgColor(this.value)">
            🎨
          </div>
        </div>
      </div>

      <!-- Photo upload -->
      <div id="photo-opts" style="display:none">
        <div class="upload-area" onclick="document.getElementById('photoInput').click()">
          <input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)">
          <div class="upload-icon">📸</div>
          <div class="upload-text">Upload Foto</div>
          <div class="upload-sub">JPG, PNG, WEBP</div>
        </div>
        <div class="field">
          <label>Opacity Overlay</label>
          <input type="range" id="overlayOpacity" min="0" max="90" value="45" oninput="updateOpacity(this.value)">
          <div class="range-val" id="opacityVal">45%</div>
        </div>
        <div class="field">
          <label>Warna Overlay</label>
          <div class="color-row">
            <div class="color-opt selected" style="background:#0d0d0d" onclick="setOverlayColor('#0d0d0d')" title="Hitam"></div>
            <div class="color-opt" style="background:#F5F500" onclick="setOverlayColor('#F5F500')" title="Kuning"></div>
            <div class="color-opt" style="background:#E63946" onclick="setOverlayColor('#E63946')" title="Merah"></div>
            <div class="color-opt color-opt-custom" title="Custom">
              <input type="color" id="customOverlayColor" value="#0d0d0d" style="opacity:0;position:absolute;width:34px;height:34px;cursor:pointer" onchange="setOverlayColor(this.value)">
              🎨
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="sidebar-section">
      <div class="section-label">Konten</div>

      <!-- PROJECT fields -->
      <div id="project-fields">
        <div class="field">
          <label>Judul Project</label>
          <input type="text" id="proj-title" value="Website Toko Batik" oninput="render()">
        </div>
        <div class="field">
          <label>Tech Stack</label>
          <input type="text" id="proj-tech" value="Next.js · Tailwind · Supabase" oninput="render()">
        </div>
        <div class="field">
          <label>Nama Klien / Kota</label>
          <input type="text" id="proj-client" value="Bu Sari — Klaten" oninput="render()">
        </div>
        <div class="field">
          <label>Deskripsi Singkat</label>
          <textarea id="proj-desc" oninput="render()">Toko online batik lokal yang sekarang bisa jualan ke seluruh Indonesia. 🔥</textarea>
        </div>
      </div>

      <!-- NEWS fields -->
      <div id="news-fields" style="display:none">
        <div class="field">
          <label>Headline</label>
          <input type="text" id="news-title" value="CumaCode Resmi Launch!" oninput="render()">
        </div>
        <div class="field">
          <label>Sub-headline</label>
          <input type="text" id="news-sub" value="Jasa coding bayar seikhlasnya" oninput="render()">
        </div>
        <div class="field">
          <label>Body Text</label>
          <textarea id="news-body" oninput="render()">Kami hadir untuk semua kalangan. Mahasiswa, UMKM, startup — semua bisa order sekarang.</textarea>
        </div>
        <div class="field">
          <label>Label / Tag (opsional)</label>
          <input type="text" id="news-tag" value="ANNOUNCEMENT" oninput="render()">
        </div>
      </div>
    </div>

    <!-- Accent Color -->
    <div class="sidebar-section">
      <div class="section-label">Warna Aksen</div>
      <div class="color-row">
        <div class="color-opt selected" style="background:#F5F500" onclick="setAccent('#F5F500')" title="Kuning"></div>
        <div class="color-opt" style="background:#F8F8F2" onclick="setAccent('#F8F8F2')" title="Putih"></div>
        <div class="color-opt" style="background:#E63946" onclick="setAccent('#E63946')" title="Merah"></div>
        <div class="color-opt" style="background:#00E5FF" onclick="setAccent('#00E5FF')" title="Cyan"></div>
        <div class="color-opt" style="background:#76FF03" onclick="setAccent('#76FF03')" title="Hijau neon"></div>
        <div class="color-opt color-opt-custom" title="Custom">
          <input type="color" id="customAccent" value="#F5F500" style="opacity:0;position:absolute;width:34px;height:34px;cursor:pointer" onchange="setAccent(this.value)">
          🎨
        </div>
      </div>
    </div>

    <!-- Download -->
    <div class="sidebar-section">
      <button class="btn-primary" onclick="render()">↻ REFRESH PREVIEW</button>
    </div>

  </div>

  <!-- ── CANVAS AREA ── -->
  <div class="canvas-area">
    <div class="canvas-wrap">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div class="canvas-info" id="canvasInfo">1080 × 1080 px · Square</div>
    <div class="download-row">
      <div class="dl-btn" onclick="download('png')">⬇ DOWNLOAD PNG</div>
      <div class="dl-btn" onclick="download('jpg')">⬇ DOWNLOAD JPG</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d');

  let state = {
    template: 'project',
    ratio: 'square',
    bgMode: 'solid',
    bgColor: '#F5F500',
    overlayColor: '#0d0d0d',
    overlayOpacity: 45,
    accentColor: '#F5F500',
    photo: null,
  };

  // ── setters ──
  function setTemplate(t) {
    state.template = t;
    document.getElementById('btn-project').classList.toggle('active', t === 'project');
    document.getElementById('btn-news').classList.toggle('active', t === 'news');
    document.getElementById('project-fields').style.display = t === 'project' ? '' : 'none';
    document.getElementById('news-fields').style.display = t === 'news' ? '' : 'none';
    render();
  }

  function setRatio(r) {
    state.ratio = r;
    document.getElementById('btn-sq').classList.toggle('active', r === 'square');
    document.getElementById('btn-pt').classList.toggle('active', r === 'portrait');
    render();
  }

  function setBgMode(m) {
    state.bgMode = m;
    document.getElementById('btn-solid').classList.toggle('active', m === 'solid');
    document.getElementById('btn-photo').classList.toggle('active', m === 'photo');
    document.getElementById('solid-opts').style.display = m === 'solid' ? '' : 'none';
    document.getElementById('photo-opts').style.display = m === 'photo' ? '' : 'none';
    render();
  }

  function setBgColor(c) {
    state.bgColor = c;
    document.querySelectorAll('#solid-opts .color-opt').forEach(el => {
      el.classList.toggle('selected', el.style.background === c || el.title === '' );
    });
    render();
  }

  function setOverlayColor(c) { state.overlayColor = c; render(); }
  function setAccent(c) { state.accentColor = c; render(); }
  function updateOpacity(v) {
    state.overlayOpacity = parseInt(v);
    document.getElementById('opacityVal').textContent = v + '%';
    render();
  }

  function loadPhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => { state.photo = img; render(); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── canvas size ──
  function getSize() {
    return state.ratio === 'square' ? [1080, 1080] : [1080, 1350];
  }

  // ── helpers ──
  function hexToRgba(hex, alpha) {
    let r = parseInt(hex.slice(1,3),16);
    let g = parseInt(hex.slice(3,5),16);
    let b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function isDark(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return (r*0.299 + g*0.587 + b*0.114) < 128;
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    let lines = [];
    for (let w of words) {
      const test = line + w + ' ';
      if (ctx.measureText(test).width > maxWidth && line !== '') {
        lines.push(line.trim());
        line = w + ' ';
      } else { line = test; }
    }
    if (line.trim()) lines.push(line.trim());
    lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
    return lines.length;
  }

  // ── MAIN RENDER ──
  function render() {
    const [W, H] = getSize();
    canvas.width = W;
    canvas.height = H;

    const textColor = state.bgMode === 'photo'
      ? (isDark(state.overlayColor) ? '#F8F8F2' : '#0d0d0d')
      : (isDark(state.bgColor) ? '#F8F8F2' : '#0d0d0d');
    const isLightText = textColor === '#F8F8F2';

    // 1. BG
    if (state.bgMode === 'solid' || !state.photo) {
      ctx.fillStyle = state.bgMode === 'solid' ? state.bgColor : '#1a1a1a';
      ctx.fillRect(0, 0, W, H);
    } else {
      // draw photo cover
      const img = state.photo;
      const scale = Math.max(W / img.width, H / img.height);
      const sw = img.width * scale, sh = img.height * scale;
      const sx = (W - sw) / 2, sy = (H - sh) / 2;
      ctx.drawImage(img, sx, sy, sw, sh);
      // overlay
      ctx.fillStyle = hexToRgba(state.overlayColor, state.overlayOpacity / 100);
      ctx.fillRect(0, 0, W, H);
    }

    // 2. Grid lines (brutalist texture)
    ctx.strokeStyle = hexToRgba(textColor, 0.06);
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 108) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }

    const P = 64; // padding

    // === PROJECT TEMPLATE ===
    if (state.template === 'project') {
      const title = document.getElementById('proj-title').value || 'Judul Project';
      const tech  = document.getElementById('proj-tech').value || 'Tech Stack';
      const client = document.getElementById('proj-client').value || 'Nama Klien';
      const desc  = document.getElementById('proj-desc').value || 'Deskripsi project.';

      // Top accent bar
      ctx.fillStyle = state.accentColor;
      ctx.fillRect(0, 0, W, 14);

      // "PROJECT SHOWCASE" label
      const labelBg = textColor;
      const labelText = isLightText ? '#0d0d0d' : '#F8F8F2';
      ctx.fillStyle = labelBg;
      ctx.fillRect(P, 50, 360, 48);
      ctx.font = `700 22px 'Space Mono', monospace`;
      ctx.fillStyle = labelText;
      ctx.fillText('PROJECT SHOWCASE', P + 16, 82);

      // Title
      ctx.font = `900 ${H === 1350 ? 108 : 96}px 'Bebas Neue', cursive`;
      ctx.fillStyle = textColor;
      const titleLines = wrapText(ctx, title.toUpperCase(), P, H * 0.32, W - P*2, H === 1350 ? 108 : 100);

      // Thick separator line
      const sepY = H * 0.32 + titleLines * (H === 1350 ? 108 : 100) + 20;
      ctx.fillStyle = state.accentColor;
      ctx.fillRect(P, sepY, W - P*2, 8);

      // Tech stack box
      ctx.font = `700 28px 'Space Mono', monospace`;
      ctx.fillStyle = hexToRgba(textColor, 0.55);
      ctx.fillText(tech, P, sepY + 52);

      // Desc
      ctx.font = `400 ${H === 1350 ? 38 : 34}px 'DM Sans', sans-serif`;
      ctx.fillStyle = hexToRgba(textColor, 0.85);
      wrapText(ctx, desc, P, sepY + 105, W - P*2, 48);

      // Bottom bar
      const barH = 100;
      ctx.fillStyle = hexToRgba(textColor, 0.08);
      ctx.fillRect(0, H - barH, W, barH);
      // border top of bar
      ctx.fillStyle = state.accentColor;
      ctx.fillRect(0, H - barH, W, 5);

      // CumaCode logo in bottom bar
      ctx.font = `700 36px 'Space Mono', monospace`;
      ctx.fillStyle = textColor;
      ctx.fillText('CUMACODE', P, H - barH + 58);

      // Client name right side
      ctx.font = `400 22px 'DM Sans', sans-serif`;
      ctx.fillStyle = hexToRgba(textColor, 0.65);
      ctx.textAlign = 'right';
      ctx.fillText(client, W - P, H - barH + 42);
      ctx.font = `700 18px 'Space Mono', monospace`;
      ctx.fillStyle = hexToRgba(state.accentColor, 0.9);
      ctx.fillText('#BayarCumaCuma', W - P, H - barH + 70);
      ctx.textAlign = 'left';

      // Corner decoration
      ctx.strokeStyle = state.accentColor;
      ctx.lineWidth = 5;
      ctx.strokeRect(P - 10, H * 0.28 - 20, W - P*2 + 20, 8);

    }

    // === NEWS TEMPLATE ===
    else {
      const title = document.getElementById('news-title').value || 'Headline';
      const sub   = document.getElementById('news-sub').value || 'Sub-headline';
      const body  = document.getElementById('news-body').value || 'Body text.';
      const tag   = document.getElementById('news-tag').value || 'NEWS';

      // Full border frame
      ctx.strokeStyle = state.accentColor;
      ctx.lineWidth = 12;
      ctx.strokeRect(32, 32, W - 64, H - 64);

      // Inner border
      ctx.strokeStyle = hexToRgba(textColor, 0.15);
      ctx.lineWidth = 2;
      ctx.strokeRect(48, 48, W - 96, H - 96);

      // Tag pill
      const tagW = ctx.measureText(tag).width + 60;
      ctx.fillStyle = state.accentColor;
      const tagBg = isDark(state.accentColor) ? '#F8F8F2' : '#0d0d0d';
      ctx.fillRect(P, P + 20, tagW, 46);
      ctx.font = `700 20px 'Space Mono', monospace`;
      ctx.fillStyle = tagBg;
      ctx.fillText(tag, P + 20, P + 50);

      // Big number / decorative element
      ctx.font = `900 280px 'Bebas Neue', cursive`;
      ctx.fillStyle = hexToRgba(textColor, 0.04);
      ctx.fillText('CC', W - 340, H * 0.52);

      // Headline
      ctx.font = `900 ${H === 1350 ? 112 : 100}px 'Bebas Neue', cursive`;
      ctx.fillStyle = textColor;
      const titleLines = wrapText(ctx, title.toUpperCase(), P, H * 0.28, W - P*2, H === 1350 ? 114 : 102);

      // Accent line
      const lineY = H * 0.28 + titleLines * (H === 1350 ? 114 : 102) + 16;
      ctx.fillStyle = state.accentColor;
      ctx.fillRect(P, lineY, 120, 8);

      // Sub headline
      ctx.font = `700 36px 'DM Sans', sans-serif`;
      ctx.fillStyle = hexToRgba(textColor, 0.75);
      ctx.fillText(sub, P, lineY + 56);

      // Body
      ctx.font = `400 ${H === 1350 ? 34 : 30}px 'DM Sans', sans-serif`;
      ctx.fillStyle = hexToRgba(textColor, 0.7);
      wrapText(ctx, body, P, lineY + 110, W - P*2, 44);

      // Bottom logo row
      const footY = H - 80;
      ctx.fillStyle = state.accentColor;
      ctx.fillRect(P, footY - 8, W - P*2, 5);

      ctx.font = `700 34px 'Space Mono', monospace`;
      ctx.fillStyle = textColor;
      ctx.fillText('CUMACODE', P, footY + 38);

      ctx.font = `700 18px 'Space Mono', monospace`;
      ctx.fillStyle = hexToRgba(state.accentColor, 0.9);
      ctx.textAlign = 'right';
      ctx.fillText('#BayarCumaCuma', W - P, footY + 20);
      ctx.font = `400 18px 'DM Sans', sans-serif`;
      ctx.fillStyle = hexToRgba(textColor, 0.5);
      ctx.fillText('cumacode.id', W - P, footY + 44);
      ctx.textAlign = 'left';
    }

    // Update info
    document.getElementById('canvasInfo').textContent =
      `${W} × ${H} px · ${state.ratio === 'square' ? 'Square 1:1' : 'Portrait 4:5'}`;
  }

  function download(type) {
    const [W, H] = getSize();
    const name = `cumacode-${state.template}-${state.ratio}-${Date.now()}`;
    if (type === 'png') {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = name + '.png';
      a.click();
    } else {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      a.download = name + '.jpg';
      a.click();
    }
  }

  // Initial render
  render();
</script>
</body>
</html>
